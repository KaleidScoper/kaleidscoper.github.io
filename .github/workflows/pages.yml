name: Pages

on:
  push:
    branches:
      - main # default branch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # If your repository depends on submodule, please see: https://github.com/actions/checkout
          submodules: recursive
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.OS }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-npm-
      - name: Install Dependencies
        run: npm install
      - name: Cache theme NPM dependencies
        uses: actions/cache@v4
        with:
          path: themes/ayeria/node_modules
          key: ${{ runner.OS }}-npm-theme-${{ hashFiles('themes/ayeria/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-npm-theme-
      - name: Build theme
        run: cd themes/ayeria && npm install && npm run build
      - name: Ensure landing font subset
        run: |
          if ! python3 tools/subset_font.py --check; then
            python3 -m pip install fonttools brotli
            # 固定源字体版本，避免构建结果随第三方字体更新而变化。
            python3 -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])' \
              'https://raw.githubusercontent.com/google/fonts/8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5/ofl/notoserifsc/NotoSerifSC%5Bwght%5D.ttf' \
              "$RUNNER_TEMP/NotoSerifSC-VF.ttf"
            python3 tools/subset_font.py --src "$RUNNER_TEMP/NotoSerifSC-VF.ttf"
            python3 tools/subset_font.py --check
          fi
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Deploy to GitHub Pages (retry)
        id: deploy-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
