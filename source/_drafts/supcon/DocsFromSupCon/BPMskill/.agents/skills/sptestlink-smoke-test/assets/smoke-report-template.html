<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{REPORT_TITLE}}</title><style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#172033;background:#f3f6fb}body{margin:0}.page{max-width:1280px;margin:auto;padding:32px}.hero,.card{background:#fff;border:1px solid #e4e9f2;border-radius:14px;box-shadow:0 4px 18px #243b6410}.hero{padding:28px;margin-bottom:20px}h1{margin:0 0 12px}.meta{color:#667085;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:20px 0}.stat{background:#fff;border-radius:12px;padding:16px;text-align:center;border:1px solid #e4e9f2}.stat b{display:block;font-size:26px}.cases{display:grid;gap:16px}.card{padding:20px}.case-head{display:flex;justify-content:space-between;gap:16px}.badge{padding:5px 12px;border-radius:999px;font-weight:700}.pass{background:#e8f8ef;color:#128447}.fail{background:#ffebec;color:#c7373f}.block{background:#fff4dc;color:#a36500}.skip{background:#eeeefe;color:#5550bd}.pending{background:#eef1f5;color:#596273}.facts{line-height:1.75;white-space:pre-wrap}.evidence{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}.evidence a{display:block;border:1px solid #dfe5ef;border-radius:10px;overflow:hidden;background:#f8fafc}.evidence img{width:100%;height:220px;object-fit:contain;display:block}.caption{padding:8px 10px;color:#586174;font-size:13px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:12px;border-bottom:1px solid #e7ebf2;text-align:left}@media(max-width:760px){.page{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="page"><section class="hero"><h1>{{REPORT_TITLE}}</h1><div class="meta">{{REPORT_META}}</div></section><section class="stats">{{REPORT_STATS}}</section><section class="cases">{{CASE_CARDS}}</section></main></body></html>
